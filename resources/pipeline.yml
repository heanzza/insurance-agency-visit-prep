        raw_path: /Volumes/${var.catalog}/${var.schema}/raw
        catalog: ${var.catalog}
        schema: ${var.schema}
      libraries:
        - file:
            path: ../src/pipeline/01_bronze.sql
        - file:
            path: ../src/pipeline/02_silver.sql
        - file:
            path: ../src/pipeline/03_gold.sql
